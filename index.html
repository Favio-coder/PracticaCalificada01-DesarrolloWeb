<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Calificada 1</title>
    <link rel="stylesheet" href="assets/styles/index.css">
</head>
<body>
    <!-- Formulario de autenticación -->
    <!-- PAGE 1 - FORMULARIO -->
    <section class="page1">

        <div class="page1-container">

            <!-- 4 ICONOS SVG -->
            <div class="icons">

                <!-- Usuario -->
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
                </svg>

                <!-- Email -->
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="M3 7l9 6 9-6"></path>
                </svg>

                <!-- Contraseña -->
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>

                <!-- Imagen -->
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                    <circle cx="8" cy="9" r="2"></circle>
                    <path d="M3 18l5-5 4 4 3-3 6 4"></path>
                </svg>

            </div>

            <h2>Registro</h2>

            <form>

                <!-- TEXT FIELD 1 -->
                <div class="input-group">

                    <input
                        type="text"
                        id="nombre"
                        placeholder=" "
                        required
                    >

                    <label for="nombre">
                        Nombre
                    </label>

                </div>


                <!-- TEXT FIELD 2 -->
                <div class="input-group">

                    <input
                        type="email"
                        id="email"
                        placeholder=" "
                        required
                    >

                    <label for="email">
                        Email
                    </label>

                </div>


                <!-- TEXT FIELD 3 -->
                <div class="input-group">

                    <input
                        type="password"
                        id="password"
                        placeholder=" "
                        required
                    >

                    <label for="password">
                        Contraseña
                    </label>

                </div>


                <!-- CAMPO PARA IMAGEN -->
                <div class="image-upload" id="dropArea">

                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>

                        <circle cx="8" cy="9" r="2"></circle>

                        <path d="M3 18l5-5 4 4 3-3 6 4"></path>
                    </svg>

                </div>

                <p id="fileName">
                    Arrastra una imagen aquí
                </p>


                <!-- CHECKBOX -->
                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="terminos"
                    >

                    <label for="terminos">
                        Acepto los términos y condiciones
                    </label>

                </div>


                <!-- BOTONES -->
                <div class="buttons">

                    <button type="reset">
                        Cancelar
                    </button>

                    <button type="submit">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </section>
    </div>


    <div>
        <p>Práctica Principal</p>
        <a href="">Index 1</a>
        <a href="">Index 2</a>
        <a href="">Index 3</a>
    </div>
</body>
</html>
